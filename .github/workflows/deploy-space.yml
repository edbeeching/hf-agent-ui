name: Deploy HF Space

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
      - prod
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload Space
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout selected ref
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub
        run: python -m pip install huggingface_hub==1.8.0

      - name: Upload Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("Missing required GitHub secret: HF_TOKEN")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          workflow_run = event.get("workflow_run", {})
          branch = workflow_run.get("head_branch") or os.environ["GITHUB_REF_NAME"]
          sha = workflow_run.get("head_sha") or os.environ["GITHUB_SHA"]
          space_by_branch = {
              "main": "edbeeching/agentic-ui-dev",
              "prod": "edbeeching/agentic-ui",
          }
          repo_id = space_by_branch.get(branch)
          if not repo_id:
              raise SystemExit(f"No Hugging Face Space target configured for branch: {branch}")

          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ["GITHUB_SERVER_URL"]
          run_id = os.environ["GITHUB_RUN_ID"]

          managed_patterns = [
              ".dockerignore",
              "Dockerfile",
              "README.md",
              "pyproject.toml",
              "uv.lock",
              "switch/**",
          ]

          ignored_patterns = [
              "**/.cache/**",
              "**/.pytest_cache/**",
              "**/__pycache__/**",
              "**/node_modules/**",
          ]

          HfApi(token=token).upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=".",
              allow_patterns=managed_patterns,
              delete_patterns=managed_patterns,
              ignore_patterns=ignored_patterns,
              commit_message=f"Deploy agentic-ui {branch} {sha[:7]}",
              commit_description=(
                  f"Source: {server}/{repo}/commit/{sha}\n"
                  f"Run: {server}/{repo}/actions/runs/{run_id}\n"
                  f"Branch: {branch}\n"
              ),
          )
          PY
