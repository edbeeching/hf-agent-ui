name: Deploy HF Space

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - development
          - production
      confirm_production:
        description: For production only, type "deploy production"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hf-space-deploy-${{ github.event.workflow_run.event || github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload Space
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event.inputs.target == 'production' || github.event.workflow_run.head_branch == 'prod' || github.ref_name == 'prod') && 'production' || 'development' }}

    steps:
      - name: Checkout CI commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout selected ref
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub
        run: python -m pip install huggingface_hub==1.8.0

      - name: Upload Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_AGENT_UI_DEV_SPACE_REPO_ID: ${{ vars.HF_AGENT_UI_DEV_SPACE_REPO_ID }}
          HF_AGENT_UI_PROD_SPACE_REPO_ID: ${{ vars.HF_AGENT_UI_PROD_SPACE_REPO_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("Missing required GitHub secret: HF_TOKEN")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          workflow_run = event.get("workflow_run", {})
          inputs = event.get("inputs", {})
          event_name = os.environ["GITHUB_EVENT_NAME"]
          branch = workflow_run.get("head_branch") or os.environ["GITHUB_REF_NAME"]
          sha = workflow_run.get("head_sha") or os.environ["GITHUB_SHA"]

          if event_name == "workflow_dispatch":
              target = inputs.get("target")
              if target == "production":
                  if branch != "prod":
                      raise SystemExit("Production deploys must be run from the prod branch")
                  if inputs.get("confirm_production") != "deploy production":
                      raise SystemExit('Production deploy requires confirm_production="deploy production"')
              elif target == "development":
                  if branch != "main":
                      raise SystemExit("Development deploys must be run from the main branch")
              else:
                  raise SystemExit(f"Unknown deploy target: {target}")

          space_by_branch = {
              "main": os.environ.get("HF_AGENT_UI_DEV_SPACE_REPO_ID") or "edbeeching/hf-agent-ui-dev",
              "prod": os.environ.get("HF_AGENT_UI_PROD_SPACE_REPO_ID") or "edbeeching/hf-agent-ui",
          }
          repo_id = space_by_branch.get(branch)
          if not repo_id:
              raise SystemExit(f"No Hugging Face Space target configured for branch: {branch}")

          repo = os.environ["GITHUB_REPOSITORY"]
          server = os.environ["GITHUB_SERVER_URL"]
          run_id = os.environ["GITHUB_RUN_ID"]

          managed_patterns = [
              ".dockerignore",
              "Dockerfile",
              "README.md",
              "pyproject.toml",
              "uv.lock",
              "hf_agent_ui/**",
          ]

          ignored_patterns = [
              "**/.cache/**",
              "**/.pytest_cache/**",
              "**/__pycache__/**",
              "**/node_modules/**",
          ]

          HfApi(token=token).upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=".",
              allow_patterns=managed_patterns,
              delete_patterns=managed_patterns,
              ignore_patterns=ignored_patterns,
              commit_message=f"Deploy hf-agent-ui {branch} {sha[:7]}",
              commit_description=(
                  f"Source: {server}/{repo}/commit/{sha}\n"
                  f"Run: {server}/{repo}/actions/runs/{run_id}\n"
                  f"Branch: {branch}\n"
              ),
          )
          PY
