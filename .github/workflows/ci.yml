name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - mvp

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --frozen pytest

      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit --desc off

      - name: Secret scan
        run: |
          uv run --with detect-secrets detect-secrets scan \
            --disable-plugin KeywordDetector \
            --exclude-files uv.lock \
            --exclude-files package-lock.json \
            --exclude-files 'switch/hub/static/assets/.*' \
            > "$RUNNER_TEMP/detect-secrets.json"
          python - <<'PY'
          import json
          import os
          import sys

          path = os.path.join(os.environ["RUNNER_TEMP"], "detect-secrets.json")
          with open(path, encoding="utf-8") as fh:
              results = json.load(fh).get("results", {})
          if results:
              print(json.dumps(results, indent=2), file=sys.stderr)
              raise SystemExit("detect-secrets found potential secrets")
          PY

      - name: Focused Python security lint
        run: >
          uv run --with bandit bandit -r switch/cli switch/daemon switch/hub -ll
          --skip B101,B104,B110,B404,B603,B607

  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: switch/web

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: switch/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify bundled hub UI is current
        working-directory: .
        run: diff -qr switch/web/dist switch/hub/static
