name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - mvp

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --frozen pytest

  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: switch/web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: switch/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify bundled hub UI is current
        working-directory: .
        run: diff -qr switch/web/dist switch/hub/static
