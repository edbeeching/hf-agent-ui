[project]
name = "hf-agent-ui"
version = "0.1.0"
description = "hf-agent-ui — browser control for Claude Code and Codex sessions"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "huggingface_hub[oauth]>=1.8.0,<2.0",
]

[project.urls]
Repository = "https://github.com/edbeeching/hf-agent-ui.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hf_agent_ui"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
hf-agent-ui = "hf_agent_ui.cli:main"
