[project]
name = "switch"
version = "0.1.0"
description = "AI session multiplexer — manage Claude Code and Codex from one place"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switch_daemon", "switch_hub", "switch_cli"]

[project.scripts]
switch = "switch_cli:main"
