[project]
name = "switch"
version = "0.1.0"
description = "agentic-ui — browser control for Claude Code and Codex sessions"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "huggingface_hub>=1.8.0,<2.0",
]

[project.urls]
Repository = "https://github.com/edbeeching/agentic-ui.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["switch"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
switch = "switch.cli:main"
