[project]
name = "switch-hub"
version = "0.1.0"
description = "Switch hub — central server for AI session multiplexing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
switch-hub = "switch_hub.__main__:main"
